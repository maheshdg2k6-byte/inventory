<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fff8f1"/>
<title>Lumière Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --gold: #755b00;
  --gold-mid: #c9a84c;
  --gold-light: #f7e292;
  --gold-pale: #faf3e7;
  --surface: #fff8f1;
  --surface-card: #ffffff;
  --surface-dim: #f5ede2;
  --outline: #d0c5b2;
  --outline-dark: #7e7665;
  --text: #1e1b15;
  --text-muted: #4d4637;
  --error: #ba1a1a;
  --error-bg: #ffdad6;
  --success-bg: #dcfce7;
  --success-text: #15803d;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --nav-h: 64px;
  --header-h: 56px;
  --radius: 14px;
  --radius-sm: 8px;
  --radius-full: 999px;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--sans);
  background: var(--surface);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
}
button { font-family: var(--sans); cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: var(--sans); }
img { display: block; }
a { text-decoration: none; color: inherit; }

/* ── App Shell ──────────────────────────── */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-width: 480px;
  margin: 0 auto;
}
@media (min-width: 480px) {
  body { background: #ede6d8; }
  #app { top: 0; bottom: 0; left: 50%; transform: translateX(-50%); box-shadow: 0 0 80px rgba(0,0,0,0.15); border-radius: 0; }
}

/* ── Screens ────────────────────────────── */
.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  background: var(--surface);
}
.screen.active { display: flex; }

/* ── Header ─────────────────────────────── */
.app-header {
  flex-shrink: 0;
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  background: var(--surface-card);
  border-bottom: 1px solid var(--outline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 16px;
  padding-right: 16px;
  gap: 12px;
  z-index: 10;
}
.header-logo { font-family: var(--serif); font-size: 20px; color: var(--gold); }
.header-back {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); color: var(--gold); flex-shrink: 0;
  transition: background 0.15s;
}
.header-back:active { background: var(--gold-pale); }
.header-action {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); color: var(--text-muted); flex-shrink: 0;
  transition: background 0.15s;
}
.header-action:active { background: var(--gold-pale); }
.header-title { font-family: var(--serif); font-size: 18px; color: var(--gold); flex: 1; }

/* ── Nav Bar ────────────────────────────── */
.app-nav {
  flex-shrink: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface-card);
  border-top: 1px solid var(--outline);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-left: 8px;
  padding-right: 8px;
  z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 6px 4px; border-radius: 12px; cursor: pointer; border: none; background: none;
  font-size: 11px; font-weight: 600; color: var(--text-muted); transition: all 0.15s; min-height: 52px;
}
.nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
.nav-item.active { color: var(--gold); background: var(--gold-light); }
.nav-item:active { transform: scale(0.94); }

/* ── Scrollable content ─────────────────── */
.scroll-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.scroll-content::-webkit-scrollbar { display: none; }

/* ── Search bar ─────────────────────────── */
.search-wrap { padding: 12px 16px 8px; }
.search-inner { position: relative; }
.search-inner svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--outline-dark); width: 18px; height: 18px; stroke-width: 2; }
.search-input {
  width: 100%; height: 44px; border-radius: var(--radius-full);
  border: 1.5px solid var(--outline); background: var(--surface-card);
  padding: 0 16px 0 44px; font-size: 14px; font-family: var(--sans); color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--gold-mid); }

/* ── Filter chips ───────────────────────── */
.chips-row {
  display: flex; gap: 8px; padding: 4px 16px 10px;
  overflow-x: auto; scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 7px 16px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  border: 1.5px solid var(--outline); background: var(--surface-card); color: var(--text-muted);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.chip.active { background: var(--gold); color: #fff; border-color: var(--gold); }
.chip:active { transform: scale(0.95); }

/* ── Item Grid ──────────────────────────── */
.items-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 4px 16px 16px;
}
.item-card {
  background: var(--surface-card); border-radius: var(--radius);
  overflow: hidden; border: 1px solid rgba(208,197,178,0.5);
  cursor: pointer; transition: transform 0.15s;
  display: flex; flex-direction: column;
}
.item-card:active { transform: scale(0.97); }
.item-card.sold { opacity: 0.6; filter: grayscale(0.25); }
.card-img-wrap { position: relative; aspect-ratio: 1; background: var(--surface-dim); overflow: hidden; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.item-card:hover .card-img-wrap img { transform: scale(1.04); }
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--outline); }
.card-badge {
  position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 6px;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  backdrop-filter: blur(4px);
}
.badge-avail { background: rgba(220,252,231,0.95); color: #15803d; }
.badge-sold { background: rgba(255,218,214,0.95); color: #9f1212; }
.card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; }
.card-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); opacity: 0.7; margin: 3px 0 6px; }
.card-price { font-size: 14px; font-weight: 700; color: var(--gold); margin-top: auto; }
.card-price.struck { text-decoration: line-through; opacity: 0.45; }

/* ── Empty state ────────────────────────── */
.empty-screen {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 32px 28px; text-align: center; gap: 16px;
}
.empty-icon-wrap {
  width: 96px; height: 96px; background: var(--gold-light); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.empty-h { font-family: var(--serif); font-size: 26px; color: var(--text); }
.empty-p { font-size: 14px; color: var(--text-muted); line-height: 1.65; }
.empty-cta {
  background: var(--gold); color: #fff; border: none; padding: 14px 32px;
  border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: var(--sans); transition: opacity 0.15s; margin-top: 8px;
}
.empty-cta:active { opacity: 0.85; transform: scale(0.98); }
.empty-hints { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 8px; opacity: 0.5; }
.empty-hint-box { border: 1.5px dashed var(--outline); border-radius: 12px; padding: 14px 8px; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); }

/* ── Add / Edit form ────────────────────── */
.form-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.form-scroll::-webkit-scrollbar { display: none; }
.form-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 32px; }
.photo-zone {
  aspect-ratio: 4/3; border-radius: var(--radius); border: 2px dashed var(--outline);
  background: var(--surface-dim); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; position: relative;
  overflow: hidden; cursor: pointer; color: var(--text-muted); transition: border-color 0.2s;
}
.photo-zone:hover { border-color: var(--gold-mid); }
.photo-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.photo-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.photo-label { font-size: 13px; font-weight: 500; }
.photo-hint { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.5; }
.form-card { background: var(--surface-card); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.f-input {
  height: 46px; border: 1.5px solid var(--outline); border-radius: var(--radius-sm);
  padding: 0 14px; font-size: 15px; font-family: var(--sans); color: var(--text);
  background: var(--surface-card); outline: none; width: 100%; transition: border-color 0.2s;
}
.f-input:focus { border-color: var(--gold-mid); }
.f-textarea {
  border: 1.5px solid var(--outline); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 15px; font-family: var(--sans); color: var(--text);
  background: var(--surface-card); outline: none; width: 100%; resize: none; transition: border-color 0.2s;
  line-height: 1.5;
}
.f-textarea:focus { border-color: var(--gold-mid); }
.mat-row { display: flex; gap: 8px; }
.mat-btn {
  flex: 1; height: 46px; border-radius: var(--radius-sm); border: 1.5px solid var(--outline);
  background: var(--surface-card); font-size: 14px; font-weight: 600; font-family: var(--sans);
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.mat-btn.on { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
.mat-btn:active { transform: scale(0.97); }
.toggle-field { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--outline); }
.toggle-info .tl { font-size: 14px; font-weight: 600; color: var(--text); }
.toggle-info .ts { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.toggle-switch {
  width: 48px; height: 26px; border-radius: 13px; background: var(--outline);
  border: none; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
}
.toggle-switch.on { background: var(--gold); }
.toggle-knob {
  width: 20px; height: 20px; background: #fff; border-radius: 50%;
  position: absolute; top: 3px; left: 3px; transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle-switch.on .toggle-knob { transform: translateX(22px); }
.save-btn {
  width: 100%; height: 54px; background: var(--gold); color: #fff; border: none;
  border-radius: var(--radius); font-size: 15px; font-weight: 700; font-family: var(--sans);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.15s; letter-spacing: 0.02em;
}
.save-btn:active { opacity: 0.85; transform: scale(0.99); }

/* ── Detail screen ──────────────────────── */
.detail-hero { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface-dim); display: block; }
.detail-hero-placeholder { width: 100%; aspect-ratio: 1; background: var(--surface-dim); display: flex; align-items: center; justify-content: center; color: var(--outline); }
.detail-content { padding: 0 16px 24px; }
.detail-card { background: var(--surface-card); border-radius: var(--radius); padding: 16px; margin-top: -28px; position: relative; z-index: 2; }
.detail-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gold); margin-bottom: 4px; }
.detail-name { font-family: var(--serif); font-size: 26px; color: var(--text); line-height: 1.2; }
.detail-sku { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 6px; }
.detail-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.section-h { font-family: var(--serif); font-size: 16px; color: var(--text); margin-bottom: 10px; margin-top: 20px; }
.specs-card { background: var(--surface-card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--outline); }
.spec-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; }
.spec-row + .spec-row { border-top: 1px solid var(--outline); }
.spec-l { font-size: 13px; color: var(--text-muted); }
.spec-v { font-size: 14px; font-weight: 600; color: var(--text); }
.spec-v.price { color: var(--gold); font-weight: 700; font-size: 16px; }
.notes-box { background: var(--surface-card); border-radius: var(--radius); padding: 14px 16px; border-left: 3px solid var(--gold-light); font-size: 14px; color: var(--text-muted); line-height: 1.7; }
.status-card { background: var(--surface-card); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--outline); margin-top: 20px; }
.action-gold {
  width: 100%; height: 52px; background: var(--gold-mid); color: #fff; border: none;
  border-radius: var(--radius); font-size: 14px; font-weight: 700; font-family: var(--sans);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
  transition: opacity 0.15s;
}
.action-gold:active { opacity: 0.85; transform: scale(0.99); }
.action-danger {
  width: 100%; height: 50px; background: transparent; color: var(--error);
  border: 1.5px solid var(--error); border-radius: var(--radius);
  font-size: 14px; font-weight: 600; font-family: var(--sans); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
  transition: background 0.15s;
}
.action-danger:active { background: var(--error-bg); }

/* ── Search screen ──────────────────────── */
.search-header-extra {
  flex-shrink: 0; background: var(--surface-card);
  border-bottom: 1px solid var(--outline); padding: 10px 16px 0; z-index: 10;
}
.search-header-row { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.search-header-row .search-inner { flex: 1; }
.results-meta { padding: 6px 16px 4px; font-size: 12px; color: var(--text-muted); }

/* ── Confirm sheet ──────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.overlay.show { display: flex; }
.sheet {
  background: var(--surface-card); border-radius: 20px 20px 0 0; padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom)); width: 100%; max-width: 480px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-title { font-family: var(--serif); font-size: 22px; color: var(--text); margin-bottom: 8px; }
.sheet-sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
.sheet-btns { display: flex; gap: 10px; }
.sheet-cancel {
  flex: 1; height: 50px; border-radius: 12px; border: 1.5px solid var(--outline);
  background: var(--surface-dim); font-size: 14px; font-weight: 600; font-family: var(--sans);
  cursor: pointer; color: var(--text);
}
.sheet-confirm {
  flex: 1; height: 50px; border-radius: 12px; border: none;
  background: var(--error); font-size: 14px; font-weight: 700; font-family: var(--sans);
  cursor: pointer; color: #fff;
}

/* ── Toast ──────────────────────────────── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1e1b15; color: #fff; padding: 12px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 600; white-space: nowrap; z-index: 300;
  opacity: 0; transition: all 0.25s; pointer-events: none; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── No items filter state ─────────────── */
.no-results { padding: 48px 16px; text-align: center; }
.no-results-icon { font-size: 40px; margin-bottom: 12px; }
.no-results-h { font-family: var(--serif); font-size: 18px; color: var(--text); margin-bottom: 6px; }
.no-results-p { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app">

<!-- ══ HOME SCREEN ══════════════════════════ -->
<div class="screen active" id="s-home">
  <div class="app-header">
    <span class="header-logo">Lumière Boutique</span>
    <button class="header-action" onclick="goTo('add')" aria-label="Add item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
  </div>
  <div class="scroll-content" id="home-scroll">
    <div class="search-wrap">
      <div class="search-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" type="text" id="home-search" placeholder="Search inventory…" oninput="renderHome()"/>
      </div>
    </div>
    <div class="chips-row" id="home-chips">
      <button class="chip active" data-f="all" onclick="setFilter(this)">All</button>
      <button class="chip" data-f="gold" onclick="setFilter(this)">Gold</button>
      <button class="chip" data-f="silver" onclick="setFilter(this)">Silver</button>
      <button class="chip" data-f="available" onclick="setFilter(this)">Available</button>
      <button class="chip" data-f="sold" onclick="setFilter(this)">Sold</button>
    </div>
    <div id="home-grid-wrap"></div>
  </div>
  <nav class="app-nav">
    <button class="nav-item active" id="nav-home" onclick="goTo('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inventory
    </button>
    <button class="nav-item" id="nav-add" onclick="goTo('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Add Item
    </button>
    <button class="nav-item" id="nav-search" onclick="goTo('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Search
    </button>
  </nav>
</div>

<!-- ══ ADD / EDIT SCREEN ══════════════════ -->
<div class="screen" id="s-add">
  <div class="app-header">
    <button class="header-back" onclick="goBack()" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <span class="header-title" id="add-title">Add New Item</span>
    <div style="width:36px"></div>
  </div>
  <div class="form-scroll">
    <div class="form-body">
      <div class="photo-zone" id="photo-zone">
        <input type="file" accept="image/*" id="photo-input" onchange="handlePhoto(event)"/>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <div class="photo-label">Upload Photo</div>
        <div class="photo-hint">PNG, JPG · up to 10MB</div>
        <img class="photo-preview" id="photo-preview" alt="Preview"/>
      </div>
      <div class="form-card">
        <div class="field">
          <label class="f-label" for="f-name">Item Name *</label>
          <input class="f-input" type="text" id="f-name" placeholder="e.g. Vintage Filigree Gold Ring"/>
        </div>
        <div class="field-row">
          <div class="field">
            <label class="f-label" for="f-cat">Category</label>
            <select class="f-input" id="f-cat">
              <option value="">Select</option>
              <option>Ring</option><option>Necklace</option><option>Bangle</option>
              <option>Bracelet</option><option>Earring</option><option>Chain</option>
              <option>Pendant</option><option>Anklet</option><option>Coin</option><option>Other</option>
            </select>
          </div>
          <div class="field">
            <label class="f-label">Material</label>
            <div class="mat-row">
              <button class="mat-btn" id="mat-gold" type="button" onclick="setMat('Gold')">Gold</button>
              <button class="mat-btn" id="mat-silver" type="button" onclick="setMat('Silver')">Silver</button>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label class="f-label" for="f-weight">Weight (g)</label>
            <input class="f-input" type="number" id="f-weight" placeholder="0.00" step="0.01" min="0"/>
          </div>
          <div class="field">
            <label class="f-label" for="f-price">Price (₹)</label>
            <input class="f-input" type="number" id="f-price" placeholder="0" min="0"/>
          </div>
        </div>
        <div class="toggle-field">
          <div class="toggle-info">
            <div class="tl">Available for Sale</div>
            <div class="ts" id="avail-status">Currently: Available</div>
          </div>
          <button class="toggle-switch on" id="avail-toggle" type="button" onclick="toggleAvail()" aria-label="Toggle availability">
            <div class="toggle-knob"></div>
          </button>
        </div>
        <div class="field">
          <label class="f-label" for="f-notes">Notes</label>
          <textarea class="f-textarea" id="f-notes" rows="3" placeholder="Describe craftsmanship, hallmark, special requests…"></textarea>
        </div>
      </div>
      <button class="save-btn" id="save-btn" type="button" onclick="saveItem()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Item to Inventory
      </button>
    </div>
  </div>
</div>

<!-- ══ DETAIL SCREEN ═══════════════════════ -->
<div class="screen" id="s-detail">
  <div class="app-header">
    <button class="header-back" onclick="goBack()" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <span class="header-title">Item Details</span>
    <button class="header-action" id="edit-btn" aria-label="Edit item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>
  <div class="scroll-content" id="detail-body"></div>
</div>

<!-- ══ SEARCH SCREEN ═══════════════════════ -->
<div class="screen" id="s-search">
  <div class="app-header" style="gap:10px">
    <button class="header-back" onclick="goBack()" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="search-inner" style="flex:1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

    </div>
  </div>
  <div class="chips-row" id="search-chips" style="padding-top:10px;background:var(--surface-card);border-bottom:1px solid var(--outline)">
    <button class="chip active" data-sf="all" onclick="setSearchFilter(this)">All</button>
    <button class="chip" data-sf="gold" onclick="setSearchFilter(this)">Gold</button>
    <button class="chip" data-sf="silver" onclick="setSearchFilter(this)">Silver</button>
    <button class="chip" data-sf="available" onclick="setSearchFilter(this)">Available</button>
    <button class="chip" data-sf="sold" onclick="setSearchFilter(this)">Sold</button>

    <div class="results-meta" id="search-meta"></div>
    <div id="search-grid-wrap"></div>
  </div>
  <nav class="app-nav">
    <button class="nav-item" onclick="goTo('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inventory
    </button>
    <button class="nav-item" onclick="goTo('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Add Item
    </button>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Search
    </button>
  </nav>
</div>

<!-- ══ DELETE CONFIRM SHEET ════════════════ -->
<div class="overlay" id="del-overlay">
  <div class="sheet">
    <div class="sheet-title">Delete this item?</div>
    <div class="sheet-sub">This will permanently remove the item from your inventory. This cannot be undone.</div>
    <div class="sheet-btns">
      <button class="sheet-cancel" onclick="closeOverlay()">Cancel</button>
      <button class="sheet-confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────
const STORE_KEY = 'lumiere_inventory_v2';
let db = loadDB();
let homeFilter = 'all';
let searchFilter = 'all';
let editId = null;
let curDetailId = null;
let prevScreen = 'home';
let availState = true;
let selMat = '';
let photoData = '';
let nextId = db.length ? Math.max(...db.map(i=>i.id))+1 : 1;

function loadDB() {
  try { const d = localStorage.getItem(STORE_KEY); return d ? JSON.parse(d) : seedData(); }
  catch { return seedData(); }
}
function saveDB() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch {}
}
function seedData() {
  return [
    {id:1,name:'18k Gold Ring',cat:'Ring',mat:'Gold',weight:5.2,price:45000,avail:true,notes:'Hallmarked BIS 750. Comfort fit band with milgrain edges.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuCDr6b0JHhDM5sXS2HP3UJ3-ixEhLjFBrn3JF0POzrVxJREZujdWzo0BPO6TPqS7RqERdToRtb133TiimwapwS-mrI4iflS9OYOeD5VY-zukorrvTuP4RsIRrZA7goOeFxEt3644aM3zieYYPm7zlqvfmPGdojjPILGZcqIAWibjos2MFKzp4YZpo8yPtzJrYYWzuhwF1kGyge3zMH2iPfR5L6xGcOarf-EVUsP6LpAIcmkB2RwEdGWMr0YezwDYTu9YaDihXZwXcI'},
    {id:2,name:'Silver Sapphire Necklace',cat:'Necklace',mat:'Silver',weight:8.1,price:12500,avail:true,notes:'Sterling silver 925. Sapphire pendant with lobster clasp.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuB2MRPNpsH4-fZRNFFZdg4wkelEVLCMHA8JvW4k-30dpD3pXclDL8to1tneLaQMk2Iq2st5cyNnhBnMT6VH6ADIirrtCMsmtgvEOWbqu2m7V9ehxzgXu13x3ZZzYrIs_hxpWq76CrfF3qBKXOdVJ2geWWyEnLEdAc2LhrsNp7yhDFnS4e5eEwnQqGWHJYUVboCeUeM5FKJIfWTQUejLsLfk2kqnpnc4AQca-S0x2IUAM8b-6Bw6lZ-C0Ew-HgfkQyps7AfEwNweaAg'},
    {id:3,name:'Classic Band Set',cat:'Ring',mat:'Gold',weight:10.4,price:32000,avail:false,notes:'Matching pair of 18k yellow gold wedding bands.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuA_cjvfgZw3yn5dbEqDJ5D5Y7q6mZrMIjwVDnuKR63cCpbOQp0Hg3qAtsfH6lE9g8V3pEO8qgzRNepUSpzzf3L1RcDWbl1PM_FqaMBM3OYFePQtL7R9U6Sb7a2GmQWL4ZoGL2rmlLpZsDqK3ZDCn8T-nXYGc2k8drj5w1CMsZ20Wccs060NbKbMWBGqmwBzbPMrsomJzIrUJ-qRx5aecFiN5ZJ3cIAW7t_PxcYx5EaR0issQmfJpvW4rdZWoFZiKMAnpGs_zkeyYeA'},
    {id:4,name:'Emerald Gold Drops',cat:'Earring',mat:'Gold',weight:3.8,price:58900,avail:true,notes:'18k gold with genuine emerald stones. Pushback closure.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuBp66M9VyQj0sv6-agTzHb1GsjqcgSCLyMqemTf8Wl_PYbbZpXv8c7mVdLJ1reJ5TxPW6bQ9vQJ75dKkZxMR2yGKWbKQo76s7m7QnM7u2S2bzBO2PX7_coLYizNac7UQFwWSuJJZ3n1T15iBJxq3H6YBHYQdQMWVax_ucqxWap8eHF5P4RDpChI68SDKo_T45hIK28cFYsR53rSTlxfWFHFGpjobcvCOKeLEZc4Vee7DrbVcWNg1D-mgVOXN5E8nLVCa9qAKgs3cWE'},
    {id:5,name:'Ethnic Gold Bangle',cat:'Bangle',mat:'Gold',weight:22.5,price:112000,avail:true,notes:'22k gold with traditional temple engraving. Hinged opening.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuCB3RgMxGIF764aFtIq4Ux_1vIxKGK1k_2g8BXO9wVS3_Xbk_DyvrOhiQA0tpDccKiEW1YEHxUAAlF5baUhl6BS4cW9CCGF5tkmPmb46SJ6NrEDUdh34xBdcuBjqtA-i3_MLLPUB0M7ab-9zBYSeKF2Thi0kgF0sMuOEjkbO6xzNKmerJ1xGBOM_3gOSmN8ThzI8dAt7b9BFfULfwgVrC5feN53cTx1Aya3YN--0OQersrYGiEI-LhYv9JsXTNJwoLE_wZA9D4mRjY'},
    {id:6,name:'Silver Charm Link',cat:'Bracelet',mat:'Silver',weight:6.3,price:8400,avail:true,notes:'Sterling silver 925 charm bracelet with star and moon charms.',photo:'https://lh3.googleusercontent.com/aida-public/AB6AXuDkX4LoMN241_jx2acfkf3LnV8413bqmaWJc1ZEEaJJURzmtsSSdKiFkP0d7-skq8QPqE_h8frb6jMHBxRb1x9FeUm1yJrgRFN2vSiZ6xmtx7CyQpDV-RLKmg87LEmKy5xB0o7ES7tZ2_JDkm0ID53GQsyvMjH4dtu3sOY4gkhNavATNhIVjdCTE5dp2TLYJzBcHpcdlD-Nc2F_CIQu2n03OSYa4NAZFgpEQP_4Edct1mHPYgg2mxIc2m3bPEK4PksZ8UfbhLvk7OrQ'},
  ];
}

// ── Utils ─────────────────────────────────────
const INR = n => '₹' + Number(n).toLocaleString('en-IN');
const qs = id => document.getElementById(id);

function placeholderImg() {
  return `<div class="card-placeholder">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
  </div>`;
}

function cardHTML(item, fromSearch) {
  const fn = fromSearch ? `prevScreen='search';openDetail(${item.id})` : `openDetail(${item.id})`;
  return `<div class="item-card${item.avail?'':' sold'}" onclick="${fn}">
    <div class="card-img-wrap">
      ${item.photo ? `<img src="${item.photo}" loading="lazy" alt="${item.name}"/>` : placeholderImg()}
      <span class="card-badge ${item.avail?'badge-avail':'badge-sold'}">${item.avail?'Available':'Sold'}</span>
    </div>
    <div class="card-body">
      <div class="card-name">${item.name}</div>
      <div class="card-meta">${item.cat} · ${item.mat}</div>
      <div class="card-price${item.avail?'':' struck'}">${INR(item.price)}</div>
    </div>
  </div>`;
}

// ── Navigation ────────────────────────────────
function goTo(s) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  qs('s-'+s).classList.add('active');
  if(s==='home') renderHome();
  if(s==='add') { if(!editId) resetForm(); }
  if(s==='search') { doSearch(); setTimeout(()=>qs('search-q').focus(),100); }
}

function goBack() {
  goTo(prevScreen==='detail' ? 'home' : prevScreen);
  if(prevScreen==='detail') prevScreen='home';
}

// ── Home ──────────────────────────────────────
function renderHome() {
  const q = (qs('home-search').value||'').toLowerCase();
  let items = db.filter(i => {
    if(homeFilter==='gold') return i.mat==='Gold';
    if(homeFilter==='silver') return i.mat==='Silver';
    if(homeFilter==='available') return i.avail;
    if(homeFilter==='sold') return !i.avail;
    return true;
  }).filter(i => !q || i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));

  const wrap = qs('home-grid-wrap');
  if(db.length===0) {
    wrap.innerHTML = `<div class="empty-screen">
      <div class="empty-icon-wrap"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      <div class="empty-h">Your vault is empty</div>
      <div class="empty-p">Start building your inventory by adding your first handcrafted piece.</div>
      <button class="empty-cta" onclick="goTo('add')">+ Add Your First Item</button>
      <div class="empty-hints"><div class="empty-hint-box">Gold Tracking</div><div class="empty-hint-box">Silver Vault</div></div>
    </div>`;
    return;
  }
  if(items.length===0) {
    wrap.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><div class="no-results-h">No items found</div><div class="no-results-p">Try a different filter or search term</div></div>`;
    return;
  }
  wrap.innerHTML = `<div class="items-grid">${items.map(i=>cardHTML(i,false)).join('')}</div>`;
}

function setFilter(el) {
  homeFilter = el.dataset.f;
  document.querySelectorAll('#home-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderHome();
}

// ── Detail ────────────────────────────────────
function openDetail(id) {
  prevScreen = 'home';
  curDetailId = id;
  renderDetail(id);
  goTo('detail');
}

function renderDetail(id) {
  const item = db.find(i=>i.id===id);
  if(!item) return;
  const body = qs('detail-body');
  body.innerHTML = `
    ${item.photo
      ? `<img class="detail-hero" src="${item.photo}" alt="${item.name}"/>`
      : `<div class="detail-hero-placeholder">${placeholderImg()}</div>`}
    <div class="detail-content">
      <div class="detail-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <div class="detail-cat">${item.cat}</div>
            <div class="detail-name">${item.name}</div>
            <div class="detail-sku">SKU: LB-${item.mat.substring(0,2).toUpperCase()}-${String(item.id).padStart(3,'0')}</div>
          </div>
          <span class="detail-badge ${item.avail?'badge-avail':'badge-sold'}" style="flex-shrink:0;margin-top:4px">${item.avail?'Available':'Sold'}</span>
        </div>
      </div>
      <div class="section-h">Specifications</div>
      <div class="specs-card">
        <div class="spec-row"><span class="spec-l">Material</span><span class="spec-v">${item.mat}</span></div>
        <div class="spec-row"><span class="spec-l">Weight</span><span class="spec-v">${item.weight}g</span></div>
        <div class="spec-row"><span class="spec-l">Price</span><span class="spec-v price">${INR(item.price)}</span></div>
      </div>
      ${item.notes ? `<div class="section-h">Notes</div><div class="notes-box">${item.notes}</div>` : ''}
      <div class="status-card">
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">Inventory Status</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Currently: ${item.avail?'Available':'Sold'}</div>
        </div>
        <button class="toggle-switch ${item.avail?'on':''}" onclick="toggleDetailStatus(${item.id})" aria-label="Toggle status">
          <div class="toggle-knob"></div>
        </button>
      </div>
      <button class="action-gold" onclick="toggleDetailStatus(${item.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        ${item.avail ? 'Mark as Sold' : 'Mark as Available'}
      </button>
      <button class="action-danger" onclick="qs('del-overlay').classList.add('show')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Delete Item
      </button>
    </div>`;
  qs('edit-btn').onclick = () => startEdit(id);
}

function toggleDetailStatus(id) {
  const item = db.find(i=>i.id===id);
  item.avail = !item.avail;
  saveDB();
  renderDetail(id);
  toast(item.avail ? '✓ Marked as Available' : '✓ Marked as Sold');
}

// ── Add / Edit ────────────────────────────────
function resetForm() {
  editId = null; selMat = ''; availState = true; photoData = '';
  ['f-name','f-weight','f-price','f-notes'].forEach(id=>{ const el=qs(id); if(el) el.value=''; });
  const fc = qs('f-cat'); if(fc) fc.value='';
  qs('mat-gold').classList.remove('on');
  qs('mat-silver').classList.remove('on');
  const t = qs('avail-toggle'); t.classList.add('on');
  qs('avail-status').textContent = 'Currently: Available';
  const pv = qs('photo-preview'); pv.style.display='none'; pv.src='';
  qs('add-title').textContent = 'Add New Item';
  qs('save-btn').textContent = ''; 
  qs('save-btn').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Item to Inventory`;
}

function startEdit(id) {
  const item = db.find(i=>i.id===id);
  if(!item) return;
  prevScreen = 'detail';
  editId = id;
  qs('add-title').textContent = 'Edit Item';
  qs('save-btn').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Update Item`;
  qs('f-name').value = item.name;
  qs('f-cat').value = item.cat;
  qs('f-weight').value = item.weight;
  qs('f-price').value = item.price;
  qs('f-notes').value = item.notes||'';
  selMat = item.mat;
  qs('mat-gold').classList.toggle('on', item.mat==='Gold');
  qs('mat-silver').classList.toggle('on', item.mat==='Silver');
  availState = item.avail;
  const t = qs('avail-toggle');
  availState ? t.classList.add('on') : t.classList.remove('on');
  qs('avail-status').textContent = 'Currently: ' + (availState ? 'Available' : 'Sold');
  if(item.photo) { photoData=item.photo; const pv=qs('photo-preview'); pv.src=item.photo; pv.style.display='block'; }
  else { photoData=''; qs('photo-preview').style.display='none'; }
  goTo('add');
}

function handlePhoto(e) {
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 10*1024*1024) { toast('Photo too large. Max 10MB.'); return; }
  const r = new FileReader();
  r.onload = ev => {
    photoData = ev.target.result;
    const pv = qs('photo-preview'); pv.src=photoData; pv.style.display='block';
  };
  r.readAsDataURL(f);
}

function setMat(m) {
  selMat = m;
  qs('mat-gold').classList.toggle('on', m==='Gold');
  qs('mat-silver').classList.toggle('on', m==='Silver');
}

function toggleAvail() {
  availState = !availState;
  const t = qs('avail-toggle');
  availState ? t.classList.add('on') : t.classList.remove('on');
  qs('avail-status').textContent = 'Currently: ' + (availState ? 'Available' : 'Sold');
}

function saveItem() {
  const name = qs('f-name').value.trim();
  if(!name) { toast('Please enter item name'); qs('f-name').focus(); return; }
  const price = parseInt(qs('f-price').value)||0;
  const weight = parseFloat(qs('f-weight').value)||0;
  const notes = qs('f-notes').value.trim();
  const cat = qs('f-cat').value||'Other';

  if(editId) {
    const item = db.find(i=>i.id===editId);
    Object.assign(item, {name,cat,mat:selMat||item.mat,weight,price,avail:availState,notes});
    if(photoData) item.photo = photoData;
    saveDB(); toast('✓ Item updated'); editId=null;
    setTimeout(()=>{ if(prevScreen==='detail'){curDetailId=item.id;renderDetail(item.id);goTo('detail');} else goTo('home'); },500);
  } else {
    db.push({id:nextId++,name,cat,mat:selMat||'Gold',weight,price,avail:availState,notes,photo:photoData});
    saveDB(); toast('✓ Item saved to inventory');
    setTimeout(()=>goTo('home'),600);
  }
}

// ── Delete ────────────────────────────────────
function closeOverlay() { qs('del-overlay').classList.remove('show'); }
function confirmDelete() {
  db = db.filter(i=>i.id!==curDetailId);
  saveDB(); closeOverlay(); toast('Item deleted');
  setTimeout(()=>goTo('home'),400);
}

// ── Search ────────────────────────────────────
function doSearch() {
  const q = (qs('search-q').value||'').toLowerCase();
  let items = db.filter(i=>{
    if(searchFilter==='gold') return i.mat==='Gold';
    if(searchFilter==='silver') return i.mat==='Silver';
    if(searchFilter==='available') return i.avail;
    if(searchFilter==='sold') return !i.avail;
    return true;
  }).filter(i=> !q || i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)||i.mat.toLowerCase().includes(q));

  qs('search-meta').textContent = `${items.length} item${items.length!==1?'s':''}`;
  const wrap = qs('search-grid-wrap');
  if(items.length===0) {
    wrap.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><div class="no-results-h">No results</div><div class="no-results-p">Try a different search or filter</div></div>`;
  } else {
    wrap.innerHTML = `<div class="items-grid">${items.map(i=>cardHTML(i,true)).join('')}</div>`;
  }
}

function setSearchFilter(el) {
  searchFilter = el.dataset.sf;
  document.querySelectorAll('#search-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  doSearch();
}

// ── Toast ─────────────────────────────────────
let toastTimer;
function toast(msg) {
  const t = qs('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// ── Close overlay on backdrop click ──────────
qs('del-overlay').addEventListener('click', e => { if(e.target===qs('del-overlay')) closeOverlay(); });

// ── Init ──────────────────────────────────────
renderHome();
</script>
</body>
</html>
